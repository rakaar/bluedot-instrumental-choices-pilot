name: Qwen3.5 9B three-task control screen
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bluedot-personal-vast-qwen35-9b-20261012
  cancel-in-progress: false
jobs:
  control-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 325
    env:
      CLOUD_TRIAL_INSTANCE_KEY: ${{ secrets.BLUEDOT_QWEN35_READ_KEY }}
      CLOUD_TRIAL_SSH_KEY: ${{ secrets.BLUEDOT_QWEN35_SSH_KEY }}
      CLOUD_TRIAL_PLAN: config/qwen35-9b-cloud-plan.json
      DO_NOT_TRACK: '1'
      VLLM_NO_USAGE_STATS: '1'
    steps:
      - name: Check out frozen screen
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Verify authorized nine-episode plan
        id: approval
        run: python3 -c "import json; p=json.load(open('$CLOUD_TRIAL_PLAN')); assert p['spend_authorized'] and p['execution_authorized'] and p['maximum_benchmark_episodes']==9 and p['personal_account_id']==345874"
      - name: Prepare official Docker benchmark
        run: bash scripts/setup_cloud_benchmark.sh
      - name: Verify checkpoint and connect to GPU
        run: python3 scripts/connect_cloud_gpu.py
      - name: Run three tasks with three samples each
        run: python3 -u scripts/run_cloud_control_screen.py --execute
      - name: Collect diagnostics and release compute
        if: always() && steps.approval.outcome == 'success'
        run: python3 -u scripts/finalize_cloud_trial.py stop
      - name: Back up and independently verify public results
        if: always() && steps.approval.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -u scripts/finalize_cloud_trial.py backup
      - name: Save complete screen archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen35-control-${{ github.run_id }}
          path: |
            logs/qwen35-9b-control-A-20261012/
            docs/qwen35-9b-control-A/
            logs/setup-qwen35-9b-20261012/
          retention-days: 14
          if-no-files-found: warn
