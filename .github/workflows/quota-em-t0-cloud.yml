name: Quota Boost EM temperature-zero cloud diagnostic
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bluedot-personal-vast-t0-20261010
  cancel-in-progress: false
jobs:
  two-episodes:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      CLOUD_TRIAL_INSTANCE_KEY: ${{ secrets.BLUEDOT_T0_READ_KEY }}
      CLOUD_TRIAL_SSH_KEY: ${{ secrets.BLUEDOT_T0_SSH_KEY }}
      CLOUD_TRIAL_PLAN: config/em-32b-t0-quota-cloud-plan.json
      DO_NOT_TRACK: '1'
      VLLM_NO_USAGE_STATS: '1'
    steps:
      - name: Check out the frozen trial code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Prepare the official cloud Docker benchmark
        run: bash scripts/setup_cloud_benchmark.sh
      - name: Connect cloud runner and load the pinned adapter
        run: python3 scripts/connect_cloud_gpu.py
      - name: Run exactly two temperature-zero Quota Boost A episodes
        run: python3 -u scripts/run_cloud_quota_t0_trial.py --execute
      - name: Collect diagnostics and stop GPU compute
        if: always()
        run: python3 -u scripts/finalize_cloud_trial.py stop
      - name: Back up and verify results on public GitHub
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -u scripts/finalize_cloud_trial.py backup
      - name: Save all cloud trial records as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quota-boost-em-t0-cloud-${{ github.run_id }}
          path: |
            logs/quota-boost-em-32b-t0-cloud-A-20261010/
            docs/quota-boost-32b-em-t0/
            logs/olmo-32b-ukaisi-download/
            logs/setup-em-t0/
          retention-days: 14
          if-no-files-found: warn
